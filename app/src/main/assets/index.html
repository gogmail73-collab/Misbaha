<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a17">
<title>السبحة</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#203c30,#101a17 60%);color:#f4f0df;font-family:Arial,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:22px}.app{width:100%;max-width:430px;text-align:center}.brand{color:#d8bd70;font-size:15px;letter-spacing:3px;margin-bottom:8px}.title{font-size:30px;margin:0 0 28px}.count{font-size:76px;font-weight:700;font-variant-numeric:tabular-nums;margin:18px 0 24px;color:#f7e7b0}.tasbeeh{width:220px;height:220px;border-radius:50%;border:8px solid #b99c56;background:linear-gradient(145deg,#294c3b,#172b23);color:#fff3c8;font-size:27px;font-weight:bold;box-shadow:0 12px 35px #0008,inset 0 3px 12px #ffffff16;touch-action:manipulation}.tasbeeh:active{transform:scale(.97)}.actions{display:flex;gap:10px;justify-content:center;margin:22px 0}.small,button{font:inherit}.small{background:#263b31;border:1px solid #59715f;color:#f5edda;padding:12px 18px;border-radius:13px}.field{width:100%;padding:14px;border-radius:12px;border:1px solid #52685a;background:#17251f;color:#fff;text-align:right;font-size:16px;margin:8px 0}.save{width:100%;background:#b99c56;color:#172019;border:0;border-radius:12px;padding:14px;font-weight:bold;margin-top:5px}.history{text-align:right;margin-top:28px}.history h3{color:#d8bd70}.item{background:#1b2b23;border:1px solid #344c3c;border-radius:12px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#a9b5a8;font-size:13px}.delete{border:0;background:transparent;color:#e6a09a;font-size:18px}
</style>
</head>
<body>
<main class="app">
<div class="brand">MISBAHA</div><h1 class="title">السُّبْحَة الإلكترونية</h1>
<div class="muted">عدد التسبيحات</div><div class="count" id="count">0</div>
<button class="tasbeeh" id="tap" aria-label="زيادة التسبيح">سَبِّح</button>
<div class="actions"><button class="small" id="undo">تراجع</button><button class="small" id="reset">تصفير</button></div>
<input class="field" id="name" maxlength="60" placeholder="اسم الذكر (اختياري)">
<button class="save" id="save">حفظ الذكر والعدد</button>
<section class="history"><h3>الأذكار المحفوظة</h3><div id="history" class="muted">لا توجد أذكار محفوظة بعد</div></section>
</main>
<script>
let count=Number(localStorage.getItem('misbaha-count')||0);
let records=JSON.parse(localStorage.getItem('misbaha-records')||'[]');
const el=id=>document.getElementById(id);
function render(){el('count').textContent=count;localStorage.setItem('misbaha-count',count);if(!records.length){el('history').textContent='لا توجد أذكار محفوظة بعد';return;}el('history').innerHTML='';records.forEach((r,i)=>{const d=document.createElement('div');d.className='item';const info=document.createElement('span');info.textContent=r.name+' — '+r.count+' تسبيحة';const del=document.createElement('button');del.className='delete';del.textContent='حذف';del.onclick=()=>{records.splice(i,1);localStorage.setItem('misbaha-records',JSON.stringify(records));render()};d.append(info,del);el('history').append(d)})}
el('tap').onclick=()=>{count++;render()};
el('undo').onclick=()=>{if(count>0)count--;render()};
el('reset').onclick=()=>{if(confirm('هل تريد تصفير العداد؟')){count=0;render()}};
el('save').onclick=()=>{const name=el('name').value.trim()||'ذكر بدون اسم';if(count===0){alert('ابدأ التسبيح أولاً');return;}records.unshift({name,count,date:new Date().toLocaleDateString('ar-EG')});localStorage.setItem('misbaha-records',JSON.stringify(records));count=0;el('name').value='';render()};
render();
</script>
</body></html>
